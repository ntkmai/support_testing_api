<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Mật Khẩu Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .message {
            color: #718096;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #718096;
        }

        .btn-secondary:hover {
            background: #4a5568;
        }

        code {
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #d53f8c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔓</div>
        <h1>Reset Mật Khẩu Admin</h1>
        <div class="message">
            Công cụ này sẽ xóa mật khẩu admin đã lưu trong localStorage.
        </div>
        
        <div id="status" class="status info">
            Nhấn nút bên dưới để xóa mật khẩu
        </div>

        <button onclick="resetPassword()">🗑️ Xóa Mật Khẩu</button>
        <button class="btn-secondary" onclick="goToHomePage()">🏠 Về Trang Chủ</button>
    </div>

    <script>
        function resetPassword() {
            try {
                // Remove admin password and session
                localStorage.removeItem('admin_password');
                localStorage.removeItem('admin_session');
                
                // Show success message
                const status = document.getElementById('status');
                status.className = 'status success';
                status.innerHTML = '✅ Đã xóa mật khẩu thành công!<br><br>Bạn có thể đặt mật khẩu mới khi quay về trang chủ.';
                
                console.log('✅ Admin password cleared successfully!');
            } catch (error) {
                const status = document.getElementById('status');
                status.className = 'status error';
                status.innerHTML = '❌ Có lỗi xảy ra: ' + error.message;
                console.error('Error:', error);
            }
        }

        function goToHomePage() {
            window.location.href = 'project-home.html';
        }

        // Check if password exists
        window.addEventListener('DOMContentLoaded', () => {
            const hasPassword = localStorage.getItem('admin_password');
            const hasSession = localStorage.getItem('admin_session');
            
            if (!hasPassword && !hasSession) {
                const status = document.getElementById('status');
                status.className = 'status info';
                status.innerHTML = 'ℹ️ Không tìm thấy mật khẩu admin nào được lưu.';
            }
        });
    </script>
</body>
</html>
